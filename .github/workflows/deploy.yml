name: Deploy Viora Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: viora-backend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag viora-api-ci:${{ github.sha }} \
            .

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'EOF'
            set -euo pipefail

            echo "Pulling latest source..."
            cd /var/www/viora/backend

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "Building and restarting backend..."
            cd /var/www/viora

            docker compose up -d --build viora-api
            docker compose ps

            echo "Checking backend..."
            for attempt in $(seq 1 20); do
              if curl --fail --silent --output /dev/null \
                http://127.0.0.1:8081/index.html; then
                echo "Deployment successful."
                docker image prune -f
                exit 0
              fi

              echo "Waiting for API: $attempt/20"
              sleep 3
            done

            echo "Health check failed."
            docker compose logs --tail=200 viora-api
            exit 1
          EOF