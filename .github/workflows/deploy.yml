name: Deploy Viora Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: viora-backend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      started_at: ${{ steps.deploy_start.outputs.timestamp }}

    steps:
      - name: Record deploy start time
        id: deploy_start
        run: |
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag viora-api-ci:${{ github.sha }} \
            .

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'EOF'
            set -euo pipefail

            APP_DIR="/var/www/viora/backend"
            COMPOSE_DIR="/var/www/viora"
            HEALTH_URL="http://127.0.0.1:8081/index.html"

            echo "========================================"
            echo "1. Kiểm tra repository"
            echo "========================================"

            cd "$APP_DIR"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Repository trên VPS có thay đổi chưa commit."
              git status --short
              exit 1
            fi

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            echo "Phiên bản hiện tại: $PREVIOUS_COMMIT"

            echo "========================================"
            echo "2. Lấy source code mới"
            echo "========================================"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            NEW_COMMIT="$(git rev-parse HEAD)"
            echo "Phiên bản mới: $NEW_COMMIT"

            echo "========================================"
            echo "3. Build và khởi động backend"
            echo "========================================"

            cd "$COMPOSE_DIR"

            docker compose up -d --build viora-api
            docker compose ps

            echo "========================================"
            echo "4. Health check"
            echo "========================================"

            for attempt in $(seq 1 20); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --output /dev/null \
                "$HEALTH_URL"; then

                echo "Health check thành công."
                docker image prune -f

                echo "========================================"
                echo "Backend deployment completed successfully."
                echo "Commit: $NEW_COMMIT"
                echo "========================================"

                exit 0
              fi

              echo "Đang chờ API: $attempt/20"
              sleep 3
            done

            echo "Health check thất bại."
            docker compose logs --tail=200 viora-api
            exit 1
          EOF

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: ${{ always() }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Send Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}

          DEPLOY_START: ${{ needs.build.outputs.started_at }}
          BUILD_STATUS: ${{ needs.build.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}

        run: |
          set -euo pipefail

          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          END_TIME="$(date +%s)"

          if [ -n "${DEPLOY_START:-}" ]; then
            TOTAL_SECONDS=$((END_TIME - DEPLOY_START))
          else
            TOTAL_SECONDS=0
          fi

          if [ "$TOTAL_SECONDS" -lt 0 ]; then
            TOTAL_SECONDS=0
          fi

          HOURS=$((TOTAL_SECONDS / 3600))
          MINUTES=$(((TOTAL_SECONDS % 3600) / 60))
          SECONDS=$((TOTAL_SECONDS % 60))

          if [ "$HOURS" -gt 0 ]; then
            DEPLOY_TIME="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ "$MINUTES" -gt 0 ]; then
            DEPLOY_TIME="${MINUTES}m ${SECONDS}s"
          else
            DEPLOY_TIME="${SECONDS}s"
          fi

          if [ -z "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_MESSAGE="$(git log -1 --pretty=%s 2>/dev/null || echo 'Chạy workflow thủ công')"
          fi

          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ]; then
            TITLE="🚀 Viora Backend Deploy Thành Công"
            TIME_LABEL="Thời gian deploy"

            RESULT_MESSAGE="$(printf '%s\n' \
              '🟢 Build: SUCCESS' \
              '🟢 Deploy: SUCCESS' \
              '🟢 Health Check: PASSED' \
              '🔗 API: http://103.173.226.189:8081/index.html')"

          elif [ "$BUILD_STATUS" = "cancelled" ] || [ "$DEPLOY_STATUS" = "cancelled" ]; then
            TITLE="⚠️ Viora Backend Deploy Đã Bị Hủy"
            TIME_LABEL="Thời gian chạy"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟠 Build: ${BUILD_STATUS}" \
              "🟠 Deploy: ${DEPLOY_STATUS}" \
              'ℹ️ Kiểm tra log để xác định trạng thái ứng dụng')"

          elif [ "$BUILD_STATUS" = "failure" ]; then
            TITLE="❌ Viora Backend Build Thất Bại"
            TIME_LABEL="Thời gian chạy"

            RESULT_MESSAGE="$(printf '%s\n' \
              '🔴 Build: FAILED' \
              '⚪ Deploy: SKIPPED' \
              'ℹ️ Phiên bản trên VPS chưa được cập nhật')"

          else
            TITLE="❌ Viora Backend Deploy Thất Bại"
            TIME_LABEL="Thời gian chạy"

            RESULT_MESSAGE="$(printf '%s\n' \
              '🟢 Build: SUCCESS' \
              '🔴 Deploy hoặc Health Check: FAILED' \
              '⚠️ Kiểm tra log và trạng thái container trên VPS')"
          fi

          MESSAGE="$(printf '%s\n' \
            "${TITLE}" \
            "" \
            "🌐 Môi trường: Production" \
            "" \
            "📦 Repository: ${REPOSITORY}" \
            "🌿 Branch: ${BRANCH}" \
            "" \
            "🔖 Commit:" \
            "${SHORT_SHA} - ${COMMIT_MESSAGE}" \
            "" \
            "👤 Người thực hiện: ${ACTOR}" \
            "🚀 Workflow: ${WORKFLOW}" \
            "⏱️ ${TIME_LABEL}: ${DEPLOY_TIME}" \
            "" \
            "${RESULT_MESSAGE}" \
            "" \
            "Chi tiết:" \
            "${RUN_URL}")"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" \
            > /dev/null