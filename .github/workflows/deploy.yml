name: Deploy Viora Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: viora-backend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag viora-api-ci:${{ github.sha }} \
            .

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'EOF'
            set -euo pipefail

            echo "Pulling latest source..."
            cd /var/www/viora/backend

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "Building and restarting backend..."
            cd /var/www/viora

            docker compose up -d --build viora-api
            docker compose ps

            echo "Checking backend..."
            for attempt in $(seq 1 20); do
              if curl --fail --silent --output /dev/null \
                http://127.0.0.1:8081/index.html; then
                echo "Deployment successful."
                docker image prune -f
                exit 0
              fi

              echo "Waiting for API: $attempt/20"
              sleep 3
            done

            echo "Health check failed."
            docker compose logs --tail=200 viora-api
            exit 1
          EOF

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: ${{ always() }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          SHORT_SHA="${SHA:0:7}"
          COMMIT_MESSAGE="$(git log -1 --pretty=%s)"

          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${SHA}"

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="🚀 Viora Backend Deploy Thành Công"
            STATUS="🟢 Health Check: PASSED"
          elif [ "$BUILD_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            TITLE="⚠️ Viora Backend Deploy Đã Bị Hủy"
            STATUS="🟡 Trạng thái: CANCELLED"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            TITLE="❌ Viora Backend Build Thất Bại"
            STATUS="🔴 Build: FAILED"
          else
            TITLE="❌ Viora Backend Deploy Thất Bại"
            STATUS="🔴 Deploy hoặc Health Check: FAILED"
          fi

          MESSAGE="$TITLE

          🌐 Môi trường: Production

          📦 Repository: $REPOSITORY
          🌿 Branch: $BRANCH

          🧾 Commit:
          $SHORT_SHA - $COMMIT_MESSAGE

          👤 Người thực hiện: $ACTOR
          🏗 Build: $BUILD_RESULT
          🚀 Deploy: $DEPLOY_RESULT
          🔢 Run: #$RUN_NUMBER

          $STATUS
          🔗 API: http://103.173.226.189:8081/index.html

          Chi tiết:
          $RUN_URL

          Commit:
          $COMMIT_URL"

          curl --fail-with-body \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"